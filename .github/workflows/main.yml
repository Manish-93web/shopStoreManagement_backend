name: Store360 Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm install
    - name: Lint
      run: npm run lint
    - name: Type-check & build
      run: npm run build
    # No automated test suite exists yet — rather than mask that gap with a fake
    # "npm run test || true" step that always reports green, lint + a real
    # TypeScript build are what this pipeline actually verifies today.
